# IBVAP landing page: Nginx site config.
# Used as-is by the Dockerfile, and on a Linux server at /etc/nginx/sites-available/ibvap-landing.
# EDIT: server_name. Certbot adds the HTTPS listener and the HTTP->HTTPS redirect for you.

server {
    listen 80;
    listen [::]:80;
    server_name ibvap.example.org;

    root  /var/www/ibvap-landing;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml;

    # Security headers. The two sha256 values allow exactly the two inline scripts in index.html.
    # If you edit either <script> block, recompute them:  python3 deploy/csp_hashes.py index.html
    add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-rn4ViYP2F4qiZlCgJRKVpplSfilTSZVM4GIa2Mtr5SE=' 'sha256-fXlltGwOXqy1Hbm3eAvKCgXLzNYBkR+e2QOrouwOkgE='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uncomment once HTTPS works on this domain (and every subdomain you care about):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = /index.html { expires -1; }          # always revalidate the page itself
    location = /og-image.png { expires 7d; }
    location / { try_files $uri $uri/ =404; }
}
